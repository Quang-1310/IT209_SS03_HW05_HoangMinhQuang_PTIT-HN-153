server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /opt/my-app/html;
    index index.html;

    access_log /opt/my-app/logs/access.log;
    error_log  /opt/my-app/logs/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # Không cho phép truy cập các tệp ẩn như .env, .git
    location ~ /\. {
        deny all;
    }
}   